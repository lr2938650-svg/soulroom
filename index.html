<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SoulRoom 🔐</title>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
:root{
  --pink:#ff5c8a;
  --bg:#fff0f5;
  --card:#fff;
  --you:#f1f1f1;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Poppins;
  background:var(--bg);
}

/* LOGIN */
#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:24px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
input,button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-top:12px;
  font-size:15px;
}
button{
  background:var(--pink);
  color:#fff;
  font-weight:600;
}

/* PIN ROW */
.pinRow{
  display:flex;
  gap:6px;
}
.pinRow button{
  width:54px;
}

/* CHAT */
#chat{
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.header{
  background:var(--pink);
  color:#fff;
  padding:14px;
  text-align:center;
  font-weight:600;
}
#typing{font-size:12px;opacity:.8}

.messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  padding-bottom:90px;
}
.msg{
  max-width:78%;
  padding:12px 14px;
  margin:6px 0;
  border-radius:18px;
  word-wrap:break-word;
  font-size:14px;
}
.me{
  background:var(--pink);
  color:#fff;
  margin-left:auto;
}
.you{
  background:var(--you);
}
.msg img{
  width:100%;
  border-radius:14px;
  margin-top:6px;
}

/* INPUT */
.inputBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px;
  box-shadow:0 -5px 15px rgba(0,0,0,.1);
}
.inputBar input[type=text]{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:1px solid #ddd;
}
.iconBtn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--pink);
  color:#fff;
  border:none;
  font-size:20px;
}

/* SCREENSHOT BLUR */
.blur{
  filter:blur(12px);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2 style="text-align:center">SoulRoom 🔐</h2>
    <input id="name" placeholder="Your Name">

    <div class="pinRow">
      <input id="pin" type="password" placeholder="Secret PIN">
      <button onclick="togglePin()">👁️</button>
    </div>

    <button onclick="join()">Enter Private Room</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="header">
    OnlyUs 💖
    <div id="typing"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="inputBar">
    <button class="iconBtn" onclick="img.click()">📷</button>
    <input type="text" id="msg" placeholder="Type message…" oninput="typing(true)">
    <button class="iconBtn" onclick="send()">➤</button>
    <input type="file" id="img" accept="image/*" hidden>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAdpLNU2c-C5KxJv2weJECSpoghz_NGNtM",
  authDomain:"soulroom-4e31d.firebaseapp.com",
  databaseURL:"https://soulroom-4e31d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"soulroom-4e31d",
  messagingSenderId:"139421380646",
  appId:"1:139421380646:web:8dc4a4e166291102d2f6e7"
});

const db=firebase.database();

/* ELEMENTS */
const login=document.getElementById("login");
const chat=document.getElementById("chat");
const nameInput=document.getElementById("name");
const pinInput=document.getElementById("pin");
const msg=document.getElementById("msg");
const img=document.getElementById("img");
const messages=document.getElementById("messages");
const typingDiv=document.getElementById("typing");

const room="onlyus";

/* ENCRYPTION */
const getKey=p=>CryptoJS.SHA256(p).toString();
let user,key;

/* UI */
function togglePin(){
  pinInput.type = pinInput.type==="password"?"text":"password";
}

/* JOIN */
async function join(){
  user=nameInput.value.trim();
  const pin=pinInput.value.trim();
  if(!user||!pin) return alert("Fill all fields");

  key=getKey(pin);
  const ref=db.ref("rooms/"+room);
  const snap=await ref.once("value");

  if(!snap.exists()) await ref.set({key});
  else if(snap.val().key!==key) return alert("Wrong PIN");

  login.style.display="none";
  chat.style.display="flex";
  listen();
}

/* SEND */
function send(){
  if(!msg.value && !img.files[0]) return;
  const ref=db.ref(`rooms/${room}/msgs`).push();
  const data={u:enc(user),time:Date.now()};
  if(msg.value) data.t=enc(msg.value);

  if(img.files[0]){
    const r=new FileReader();
    r.onload=e=>{data.i=enc(e.target.result);ref.set(data);}
    r.readAsDataURL(img.files[0]);
  }else ref.set(data);

  msg.value="";
  img.value="";
  typing(false);
}

/* LISTEN */
function listen(){
  db.ref(`rooms/${room}/msgs`).on("child_added",s=>{
    const m=s.val();
    const sender=dec(m.u);
    const d=document.createElement("div");
    d.className="msg "+(sender===user?"me":"you");
    if(m.t) d.innerHTML+=dec(m.t);
    if(m.i){const im=new Image();im.src=dec(m.i);d.appendChild(im);}
    messages.appendChild(d);
    messages.scrollTop=messages.scrollHeight;
  });
}

/* TYPING */
function typing(v){
  const r=db.ref(`typing/${room}/${user}`);
  v?r.set(true):r.remove();
  r.onDisconnect().remove();
}
db.ref(`typing/${room}`).on("value",s=>{
  if(!typingDiv) return;
  const o=s.val()||{};
  typingDiv.innerText=
    Object.keys(o).filter(u=>u!==user).length?"Typing…":"";
});

/* ENCRYPT HELPERS */
const enc=t=>CryptoJS.AES.encrypt(t,key).toString();
const dec=t=>CryptoJS.AES.decrypt(t,key).toString(CryptoJS.enc.Utf8);

/* SCREENSHOT / RECORD DETECT */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    chat.classList.add("blur");
    db.ref(`rooms/${room}/msgs`).push({
      u:enc("System"),
      t:enc("⚠️ Screenshot / Screen activity detected"),
      time:Date.now()
    });
  }else chat.classList.remove("blur");
});
</script>
</body>
</html>
